<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colegio App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="bg-light">

    <!-- ==========================================
         HEADER / BARRA DE NAVEGACIÓN
    =========================================== -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container-fluid">
                <!-- Marca / Nombre de la App -->
                <a class="navbar-brand fw-bold" href="">
                    <i class="bi bi-journal-bookmark-fill me-2"></i>ColegioApp
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <!-- Enlaces dinámicos según el Rol (Renderizados por jQuery) -->
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="navRoleLinks">
                        <!-- Ej: Alumnos verán "Mis Exámenes", Profesores "Mis Alumnos", Admin "Gestión" -->
                    </ul>

                    <!-- Zona Derecha: Botones según estado de sesión -->
                    <div class="d-flex align-items-center ms-auto" id="navAuthZone">
                        
                        <!-- ESTADO 1: No autenticado (Visible por defecto) -->
                        <div id="navLoggedOutUI" class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#modalLogin">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Login
                            </button>
                            <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalRegister">
                                <i class="bi bi-person-plus me-1"></i>Registro
                            </button>
                        </div>

                        <!-- ESTADO 2: Autenticado (Gestionado por jQuery) -->
                        <div id="navLoggedInUI" class="dropdown d-none">
                            <button class="btn btn-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle fs-5"></i>
                                <span id="navUserName">Cargando...</span>
                                <span id="navUserRoleBadge" class="badge bg-info text-dark ms-1">Rol</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                                <li><h6 class="dropdown-header" id="navUserEmail">email@ejemplo.com</h6></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <button class="dropdown-item text-danger" id="btnLogout">
                                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                                    </button>
                                </li>
                            </ul>
                        </div>

                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- ==========================================
         MAIN / CONTENIDO DINÁMICO CAMBIANTE
    =========================================== -->
    <main class="container py-4">
        
        <!-- Vista pública (Usuario no logueado) -->
        <section id="viewPublic" class="text-center py-5">
            <h1 class="display-4 fw-bold text-dark">Bienvenido a ColegioApp</h1>
            <p class="lead text-muted">Inicia sesión o regístrate para acceder a tu panel académico.</p>
        </section>

        <!-- Vista Alumno -->
        <section id="viewAlumno" class="d-none">
            <!-- jQuery inyectará aquí las asignaturas, exámenes y notas -->
        </section>

        <!-- Vista Profesor -->
        <section id="viewProfesor" class="d-none">
            <!-- jQuery inyectará aquí la lista de alumnos asignados -->
        </section>

        <!-- Vista Admin -->
        <section id="viewAdmin" class="d-none">
            <!-- jQuery inyectará aquí los paneles de gestión -->
        </section>

    </main>

    <!-- ==========================================
         MODALES DE BOOTSTRAP
    =========================================== -->

    <!-- Modal Login -->
    <div class="modal fade" id="modalLogin" tabindex="-1" aria-labelledby="modalLoginLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalLoginLabel"><i class="bi bi-shield-lock me-2"></i>Iniciar Sesión</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formLogin">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="loginEmail" name="email" required placeholder="tu@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="loginPassword" name="password" required placeholder="••••••••">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnLoginSubmit">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Registro -->
    <div class="modal fade" id="modalRegister" tabindex="-1" aria-labelledby="modalRegisterLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalRegisterLabel"><i class="bi bi-person-plus-fill me-2"></i>Crear Cuenta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formRegister">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="regNombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="regNombre" name="nombre" required placeholder="Juan Pérez">
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="regEmail" name="email" required placeholder="tu@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="regPassword" name="password" required placeholder="••••••••">
                        </div>
                        
                        <!-- Rol por defecto para autoregistro público -->
                        <input type="hidden" name="role" id="regRole" value="alumno">
                        
                        <!-- Selector de Rol (Se mostrará solo cuando un Admin dé de alta a un Profesor/Alumno) -->
                        <div class="mb-3 d-none" id="containerRoleSelector">
                            <label for="regRoleSelect" class="form-label">Rol del Usuario</label>
                            <select class="form-select" id="regRoleSelect" name="role_select">
                                <option value="alumno" selected>Alumno</option>
                                <option value="profesor">Profesor</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success" id="btnRegisterSubmit">Registrarme</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ==========================================
         CONTENEDOR DE TOASTS (NOTIFICACIONES)
    =========================================== -->
    <!-- Contenedor de Toasts (colocado en la esquina inferior derecha) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div id="toastBody" class="toast-body">
                    <!-- El mensaje de JS se inserta aquí -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- JS de jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    
    <!-- Scripts Propios -->
    <script src="JS/utils.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/alumno.js"></script>
    <script src="JS/profesor.js"></script>
    <script src="JS/admin.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
