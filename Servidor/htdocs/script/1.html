<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripting</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <h1 onmouseover="fondo_verde()">SCRIPTING</h1>
    <p>Viernes</p>
    <b onmouseover="fondo_amarillo()" onmouseleave="fondo_rojo()">Oleiros</b>
    <br>
    <!-- onkeydown, onkeypress, onkeyup, onchange -->
    <input type="text" placeholder="Nombre" onchange="copiar()">
    <br>
    <button onclick="pon_dia()">Pinchar</button>
    <br>
    <button onclick="fondo_rojo()">Rojo</button>

    <script>
        function pon_dia() {
            // var dia = $("p").text() === "Viernes" ? "Sábado" : "Viernes"
            $("p").text($("p").text() === "Viernes" ? "Sábado" : "Viernes");
        }

        function fondo_rojo() {
            $("body").css("background-color", "red")
        }
        
        function fondo_amarillo() {
            $("body").css("background-color", "yellow")
        }

        function fondo_verde() {
            $("h1").css("background-color", "lime")
        }

        function copiar() {
            var texto;
            texto = $("input").val();
            $("b").text(texto);
        }
    </script>
</body>
</html>
