<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tareas: <span></span></h1>
    </header>
    <main>
        <input type="text" placeholder="Texto de la tarea" >
        <br>
        <button type="button" onclick="agregar()" >Añadir</button>
        <ul>

        </ul>
    </main>

    <script>
        var cont = 0;
        $("span").text(cont)
        function agregar(){
            var texto = $("input").val().trim();
            if (texto !== "") {
                // Creamos el li con el párrafo y el checkbox
                var nuevoLi = "<li><p>" + texto + "</p><input type=checkbox></li>";
                
                // Lo añadimos a la ul
                $("ul").append(nuevoLi);
                
                // Limpiamos el input
                $("input[type=text]").val("");
                cont++;
                $("span").text(cont)
            } else {
                $("input[type=text]").val("");
            }
            $("input[type=text]").focus();
        }

        $(document).on("click", "input[type='checkbox']", function (){
            // Alternamos el estado booleano
            var ischecked = $(this).prop("checked"); 

            if (ischecked) {
                cont--
                $("span").text(cont)
            } else {
                cont++
                $("span").text(cont)
            }

            // Alternamos la clase en el párrafo hermano
            $(this).siblings("p").toggleClass("marcado", ischecked);
        });

    </script>
</body>
</html>
