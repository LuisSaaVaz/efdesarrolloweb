<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mesas</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .card-mesa {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border-width: 2px;
        }

        .card-mesa:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .mesa-tarjeta.libre {
            background-color: #d1e7dd;
            border-color: #0f5132;
            color: #0f5132;
        }

        .mesa-tarjeta.ocupada {
            background-color: #f8d7da;
            border-color: #842029;
            color: #842029;
        }

        .mesa-tarjeta.libre .icono-mesa {
            color: rgb(25, 135, 84);
        }

        .mesa-tarjeta.ocupada .icono-mesa {
            color: rgb(255, 17, 0);
        }

        .badge-estado.libre {
            background-color: #198754;
        }

        .badge-estado.ocupada {
            background-color: #dc3545;
        }

        /* Card Bebidas */
        .card-bebida {
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .card-bebida:hover {
            transform: scale(1.02);
            border-color: #0d6efd;
        }
        .img-bebida {
            height: 50px;
            object-fit: cover;
        }

        /* --- CORRECCIÓN DE DESBORDAMIENTO (CONTAINMENT FLEXBOX) --- */
        
        .modal-body-fixed {
            height: 80vh;
            max-height: 80vh;
            overflow: hidden !important;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .layout-split {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        /* 1. SECCIÓN BEBIDAS */
        .seccion-bebidas {
            flex: 1 1 50%;
            height: 50%;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 8px;
        }

        .scroll-bebidas {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
        }

        /* 2. SECCIÓN TICKET (Ajustada para no desbordar) */
        .seccion-ticket {
            flex: 1 1 50%;
            height: 50%;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: 8px;
        }

        .scroll-ticket {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }

        /* VISTA ESCRITORIO (md / >= 768px) */
        @media (min-width: 768px) {
            .layout-split {
                flex-direction: row;
                gap: 12px;
            }
            .seccion-bebidas {
                flex: 1 1 58%;
                max-width: 58%;
                height: 100%;
                border-bottom: none;
                border-end: 2px solid #dee2e6;
                padding-bottom: 0;
                padding-right: 12px;
            }
            .seccion-ticket {
                flex: 1 1 42%;
                max-width: 42%;
                height: 100%;
                padding-top: 0;
            }
            .img-bebida {
                height: 65px;
            }
        }

        /* Barras de scroll finas */
        .scroll-bebidas::-webkit-scrollbar,
        .scroll-ticket::-webkit-scrollbar {
            width: 5px;
        }
        .scroll-bebidas::-webkit-scrollbar-thumb,
        .scroll-ticket::-webkit-scrollbar-thumb {
            background-color: #adb5bd;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar Superior -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fa-solid fa-utensils me-2"></i> Control de Mesas
            </span>
            <button id="btn-recargar" class="btn btn-outline-light btn-sm">
                <i class="fa-solid fa-rotate-right me-1"></i> Actualizar
            </button>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Leyenda -->
        <div class="d-flex justify-content-end mb-4 gap-3">
            <span class="badge bg-success fs-6"><i class="fa-solid fa-circle me-1"></i> Libre</span>
            <span class="badge bg-danger fs-6"><i class="fa-solid fa-circle me-1"></i> Ocupada</span>
        </div>

        <!-- Contenedor Responsive Grid para las Mesas -->
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="contenedor-mesas"></div>
    </div>

    <!-- MODAL DE ATENCIÓN DE MESA -->
    <div class="modal fade" id="modalMesa" tabindex="-1" aria-labelledby="modalMesaLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content overflow-hidden">
                
                <div class="modal-header bg-dark text-white py-2">
                    <h5 class="modal-title fs-6 fw-bold" id="modalMesaLabel">
                        <i class="fa-solid fa-utensils me-2"></i><span id="titulo-modal-mesa">Mesa</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <!-- Body con alto fijo y contención de desbordamiento -->
                <div class="modal-body modal-body-fixed p-2 p-md-3">
                    <div class="layout-split">
                        
                        <!-- PARTE 1: CATÁLOGO DE BEBIDAS -->
                        <div class="seccion-bebidas">
                            <h6 class="fw-bold mb-2 fs-6 text-truncate">
                                <i class="fa-solid fa-wine-glass me-1 text-primary"></i> Catálogo de Bebidas
                            </h6>
                            <!-- Scroll propio del catálogo -->
                            <div class="scroll-bebidas">
                                <div class="row row-cols-2 row-cols-sm-3 g-2" id="contenedor-bebidas">
                                    <!-- Carga AJAX -->
                                </div>
                            </div>
                        </div>

                        <!-- PARTE 2: TICKET / PEDIDO DE MESA -->
                        <div class="seccion-ticket">
                            <h6 class="fw-bold mb-2 fs-6 text-truncate">
                                <i class="fa-solid fa-receipt me-1 text-danger"></i> Consumiciones de la Mesa
                            </h6>
                            
                            <!-- Scroll propio de las líneas del ticket -->
                            <div class="scroll-ticket">
                                <ul class="list-group list-group-flush" id="lista-pedido">
                                    <li class="list-group-item text-center text-muted py-3" id="pedido-vacio">
                                        No hay consumiciones añadidas.
                                    </li>
                                </ul>
                            </div>

                            <!-- Footer con Total y Botón Pagar -->
                            <div class="border-top pt-2 mt-2 bg-white">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fs-6 fw-bold">Total:</span>
                                    <span class="fs-5 fw-bold text-success" id="total-pedido">0.00 €</span>
                                </div>
                                <button type="button" class="btn btn-success btn-sm w-100 py-2 fw-bold" id="btn-pagar">
                                    <i class="fa-solid fa-credit-card me-2"></i> Pagar Mesa
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Contenedor Toast para Notificaciones -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="toast-mensaje" class="toast align-items-center text-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fs-6" id="toast-texto"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- jQuery 3.7.1 y Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {

            var mesaSeleccionada = null;
            var pedidoActual = [];
            var catalogoBebidas = [];

            function mostrarToast(mensaje, esExito) {
                var $toast = $('#toast-mensaje');
                $toast.removeClass('bg-success bg-danger').addClass(esExito ? 'bg-success' : 'bg-danger');
                $('#toast-texto').text(mensaje);
                new bootstrap.Toast($toast[0]).show();
            }

            // Cargar listado de mesas
            function cargarMesas() {
                $.get('./PHP/get_mesas.php', function(respuesta) {
                    if (respuesta.status === 'success') {
                        var $contenedor = $('#contenedor-mesas').empty();

                        if (respuesta.mesas.length === 0) {
                            $contenedor.html('<div class="col-12 text-center text-muted">No hay mesas registradas.</div>');
                            return;
                        }

                        $.each(respuesta.mesas, function(i, mesa) {
                            var tarjetaHTML = `
                                <div class="col">
                                    <div class="card card-mesa mesa-tarjeta ${mesa.estado} text-center h-100 p-2" 
                                         data-id="${mesa.id_mesa}" 
                                         data-numero="${mesa.numero_mesa}"
                                         data-estado="${mesa.estado}">
                                        <div class="card-body d-flex flex-column justify-content-between align-items-center">
                                            <span class="badge badge-estado ${mesa.estado} align-self-end text-capitalize px-2 py-1">
                                                ${mesa.estado}
                                            </span>
                                            <i class="fa-solid fa-utensils icono-mesa fa-3x my-2"></i>
                                            <h5 class="card-title fw-bold mb-0">Mesa ${mesa.numero_mesa}</h5>
                                        </div>
                                    </div>
                                </div>`;
                            $contenedor.append(tarjetaHTML);
                        });
                    } else {
                        mostrarToast(respuesta.message || 'Error al cargar las mesas.', false);
                    }
                }, 'json').fail(function() {
                    mostrarToast("Error de conexión con el servidor.", false);
                });
            }

            // Cargar listado de bebidas
            function cargarBebidas() {
                $.get('./PHP/get_bebidas.php', function(respuesta) {
                    if (respuesta.status === 'success') {
                        catalogoBebidas = respuesta.bebidas;
                        var $contenedor = $('#contenedor-bebidas').empty();

                        $.each(catalogoBebidas, function(i, bebida) {
                            var fotoUrl = bebida.foto || 'https://via.placeholder.com/150';
                            var tarjetaBebida = `
                                <div class="col">
                                    <div class="card card-bebida h-100 shadow-sm btn-agregar-bebida" 
                                         data-id="${bebida.id_bebida}"
                                         data-nombre="${bebida.nombre}"
                                         data-precio="${bebida.precio}">
                                        <img src="${fotoUrl}" class="card-img-top img-bebida" alt="${bebida.nombre}">
                                        <div class="card-body p-1 text-center">
                                            <h6 class="card-title fs-7 fw-bold mb-1 text-truncate">${bebida.nombre}</h6>
                                            <span class="badge bg-primary">${parseFloat(bebida.precio).toFixed(2)} €</span>
                                        </div>
                                    </div>
                                </div>`;
                            $contenedor.append(tarjetaBebida);
                        });
                    } else {
                        mostrarToast(respuesta.message || 'Error al cargar bebidas.', false);
                    }
                }, 'json').fail(function() {
                    mostrarToast("Error al obtener las bebidas.", false);
                });
            }

            // Renderizar pedido en pantalla
            function renderizarPedido() {
                var $lista = $('#lista-pedido').empty();
                var total = 0;

                if (pedidoActual.length === 0) {
                    $lista.html('<li class="list-group-item text-center text-muted py-3">No hay consumiciones añadidas.</li>');
                    $('#total-pedido').text('0.00 €');
                    return;
                }

                $.each(pedidoActual, function(i, item) {
                    var subtotal = item.precio * item.cantidad;
                    total += subtotal;

                    var itemHTML = `
                        <li class="list-group-item d-flex justify-content-between align-items-center p-2">
                            <div class="lh-1 me-1 text-truncate">
                                <span class="fw-bold fs-7 text-truncate d-block">${item.nombre}</span>
                                <small class="text-muted fs-8">${parseFloat(item.precio).toFixed(2)} € x ${item.cantidad}</small>
                            </div>
                            <div class="d-flex align-items-center gap-1 flex-shrink-0">
                                <span class="badge bg-secondary rounded-pill">x${item.cantidad}</span>
                                <span class="fw-bold text-dark fs-7 me-1">${subtotal.toFixed(2)} €</span>
                                <button class="btn btn-sm btn-outline-danger p-1 py-0 btn-restar" data-id="${item.id_bebida}">
                                    <i class="fa-solid fa-minus fs-8"></i>
                                </button>
                            </div>
                        </li>`;
                    $lista.append(itemHTML);
                });

                $('#total-pedido').text(total.toFixed(2) + ' €');
            }

            // Click en mesa
            $(document).on('click', '.card-mesa', function() {
                mesaSeleccionada = {
                    id: $(this).data('id'),
                    numero: $(this).data('numero'),
                    estado: $(this).data('estado')
                };

                $('#titulo-modal-mesa').text('Mesa ' + mesaSeleccionada.numero);
                
                pedidoActual = [];
                renderizarPedido();

                if (catalogoBebidas.length === 0) {
                    cargarBebidas();
                }

                var modal = new bootstrap.Modal(document.getElementById('modalMesa'));
                modal.show();
            });

            // Añadir bebida
            $(document).on('click', '.btn-agregar-bebida', function() {
                var id = $(this).data('id');
                var nombre = $(this).data('nombre');
                var precio = parseFloat($(this).data('precio'));

                var existente = pedidoActual.find(item => item.id_bebida === id);

                if (existente) {
                    existente.cantidad += 1;
                } else {
                    pedidoActual.push({
                        id_bebida: id,
                        nombre: nombre,
                        precio: precio,
                        cantidad: 1
                    });
                }

                renderizarPedido();
            });

            // Restar bebida
            $(document).on('click', '.btn-restar', function() {
                var id = $(this).data('id');
                var index = pedidoActual.findIndex(item => item.id_bebida === id);

                if (index !== -1) {
                    if (pedidoActual[index].cantidad > 1) {
                        pedidoActual[index].cantidad -= 1;
                    } else {
                        pedidoActual.splice(index, 1);
                    }
                }

                renderizarPedido();
            });

            // Cargar datos iniciales
            cargarMesas();
            $('#btn-recargar').click(cargarMesas);
        });
    </script>
</body>
</html>
