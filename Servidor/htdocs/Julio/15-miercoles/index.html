<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebidas y postres</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fa-solid fa-basket-shopping" style="color: rgb(116, 192, 252);"></i>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="" id="btn-bebidas">Vehiculos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="" id="btn-postres">Postres</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="d-flex justify-content-between gap-3 p-3">
        <!-- FORMULARIO ÚNICO -->
        <section id="formulario" class="col">
            <h3 id="form-titulo">Insertar Bebida</h3>
            <form class="mi-formulario">
                <!-- Este input hidden cambiará su value dinámicamente -->
                <input type="hidden" name="tipo" id="input-tipo" value="bebidas">
                
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="input-nombre" name="nombre" placeholder="Nombre">
                    <label for="input-nombre">Nombre</label>
                </div>
                <div class="form-floating mb-3">
                    <textarea class="form-control" id="input-descripcion" name="descripcion" placeholder="Descripción" style="height: 10rem; resize: none;"></textarea>
                    <label for="input-descripcion">Descripción</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="number" step="0.01" class="form-control" id="input-precio" name="precio" placeholder="Precio">
                    <label for="input-precio">Precio</label>
                </div>
                <!-- El botón cambiará de estilo y texto -->
                <button type="submit" id="btn-submit" class="btn btn-primary">Guardar Bebida</button>
            </form>
        </section>

        <!-- TABLA ÚNICA -->
        <section id="tabla" class="col">
            <h3 id="tabla-titulo">Lista de Bebidas</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <!-- El contenido se cargará por AJAX aquí -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- MODAL DE EDICIÓN -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarTitulo">Editar Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-editar">
                    <div class="modal-body">
                        <!-- ID oculto del registro a modificar -->
                        <input type="hidden" id="edit-id" name="id">
                        
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="edit-nombre" name="nombre" placeholder="Nombre" required>
                            <label for="edit-nombre">Nombre</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea class="form-control" id="edit-descripcion" name="descripcion" placeholder="Descripción" style="height: 8rem; resize: none;" required></textarea>
                            <label for="edit-descripcion">Descripción</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="edit-precio" name="precio" placeholder="Precio" required>
                            <label for="edit-precio">Precio</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN DE BORRADO -->
    <div class="modal fade" id="modalBorrar" tabindex="-1" aria-labelledby="modalBorrarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">¿Confirmar eliminación?</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>¿Estás seguro de que deseas eliminar este elemento? Esta acción no se puede deshacer.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btn-confirmar-borrar" class="btn btn-danger">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DE TOASTS (Fijo en la esquina inferior derecha) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" id="toast-mensaje">
                    <!-- El texto de error/éxito se insertará aquí -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Librerías externas -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>

    <!-- Custom Scripts -->
    <script src="./JS/globales.js"></script>
    <script src="./JS/operaciones.js"></script>
    <script src="./JS/main.js"></script>

    
</body>
</html>
