<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h3 class="card-title text-center mb-3">Recuperar Contraseña</h3>
                    <form id="form-recuperar">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email registrado</label>
                            <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast de Bootstrap -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast-mensaje" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toast-texto"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            function mostrarToast(mensaje, esExito) {
                var $toast = $('#toast-mensaje');
                $toast.removeClass('bg-success bg-danger');
                $toast.addClass(esExito ? 'bg-success' : 'bg-danger');
                $('#toast-texto').text(mensaje);
                
                var bsToast = new bootstrap.Toast($toast[0]);
                bsToast.show();
            }

            $('#form-recuperar').submit(function(e) {
                e.preventDefault();

                // Construir objeto de datos manualmente sin serialize
                var datos = {
                    email: $('#email').val().trim()
                };

                $.post('recuperarPass.php', datos, function(res) {
                    mostrarToast(res.mensaje, true);
                    $('#email').val('');
                }, 'json').fail(function(error) {
                    var msg = "Ocurrió un error inesperado.";
                    if (error.responseJSON && error.responseJSON.mensaje) {
                        msg = error.responseJSON.mensaje;
                    }
                    mostrarToast(msg, false);
                });
            });
        });
    </script>
</body>
</html>
