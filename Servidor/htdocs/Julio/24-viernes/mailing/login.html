<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{url_for('static', filename='CSS/style.css')}}">
    <!-- Bootstrap 5.3 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <header class="text-center mt-5">
        <h1>Login</h1>
    </header>

    <main class="container">
        <div class="row justify-content-center mt-4">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm p-4">
                    <!-- Le pasamos 'event' a la función para evitar el refresco por defecto -->
                    <form id="formLogin" onsubmit="login(event)">
                        <div class="mb-3">
                            <input type="email" id="email" name="email" class="form-control" placeholder="Email">
                        </div>
                        <div class="mb-3">
                            <input type="password" id="password" name="password" class="form-control" placeholder="Password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Enviar</button>
                    </form>
                    <br>
                    <p class="text-center mb-0">¿No recuerdas la contraseña? <a href="./solicitarPass.html">Cambiar</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- CONTENEDOR TOAST BOOTSTRAP -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveToast" class="toast align-items-center text-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fs-6" id="toastMessage">
                    <!-- El mensaje se insertará aquí -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Librería JQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPT LOGIN -->
    <script>
        function login(event) {
            // 1. Evitar que el formulario recargue la página automáticamente
            event.preventDefault();

            // 2. Obtener los datos del formulario
            var datos = {
                email: $('#email').val(),
                password: $('#password').val()
            };

            // 3. Enviar la petición POST con jQuery a login.php
            $.post('login.php', datos, function(respuesta) {
                
                // Función auxiliar para mostrar el Toast
                function mostrarToast(mensaje, esExito) {
                    var $toast = $('#liveToast');
                    
                    // Ajustar color de fondo según sea correcto (bg-success) o error (bg-danger)
                    if (esExito) {
                        $toast.removeClass('bg-danger').addClass('bg-success');
                    } else {
                        $toast.removeClass('bg-success').addClass('bg-danger');
                    }

                    $('#toastMessage').text(mensaje);
                    var toast = new bootstrap.Toast($toast[0]);
                    toast.show();
                }

                // 4. Evaluar la respuesta devuelta por login.php
                if (respuesta.status === 'success') {
                    mostrarToast(respuesta.message || 'Login correcto. Redirigiendo...', true);
                    
                    // Esperar 1.5 segundos para que el usuario pueda ver el Toast antes de navegar
                    setTimeout(function() {
                        window.location.href = 'user.html';
                    }, 1500);

                } else {
                    mostrarToast(respuesta.message || 'Error al iniciar sesión', false);
                }

            }, 'json').fail(function() {
                // En caso de fallo de red o error 500 del servidor
                $('#liveToast').removeClass('bg-success').addClass('bg-danger');
                $('#toastMessage').text('Error de conexión con el servidor.');
                var toast = new bootstrap.Toast($('#liveToast')[0]);
                toast.show();
            });
        }
    </script>
</body>
</html>
