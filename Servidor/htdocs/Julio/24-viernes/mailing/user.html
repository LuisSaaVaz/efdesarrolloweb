<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuario</title>

    <!-- Bootstrap 5.3 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-sm p-4">
                    <!-- Mensaje de saludo que se actualizará con jQuery -->
                    <h1 class="h3 mb-3" id="saludo">Cargando datos...</h1>
                    
                    <hr>

                    <a href="logout.php" class="btn btn-outline-danger btn-sm w-50 mx-auto">
                        <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery y Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            // Consultar la sesión activa al cargar la página
            $.get('check_session.php', function(respuesta) {
                if (respuesta.logged) {
                    // Si el nombre viene vacío en el array, mostramos el email
                    var nombreUsuario = respuesta.usuario.nombre || respuesta.usuario.email;
                    
                    $('#saludo').html('¡Hola, <span class="text-primary">' + nombreUsuario + '</span>!');
                } else {
                    // Si no hay sesión iniciada, redirigir al login
                    window.location.href = 'index.html';
                }
            }, 'json').fail(function() {
                // Si ocurre un error en la petición
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
