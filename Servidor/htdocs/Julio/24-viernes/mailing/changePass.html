<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h3 class="card-title text-center mb-3">Nueva Contraseña</h3>
                    
                    <form id="form-change">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="newpass" class="form-label">Nueva Contraseña</label>
                            <input type="password" id="newpass" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmpass" class="form-label">Confirmar Contraseña</label>
                            <input type="password" id="confirmpass" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Guardar Cambio</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast de Bootstrap -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast-mensaje" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toast-texto"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            // Extraer el token 't' de la URL (?t=XXXXX)
            var urlParams = new URLSearchParams(window.location.search);
            var tokenURL = urlParams.get('t');

            if (!tokenURL) {
                mostrarToast("Token ausente en la URL. Solicita de nuevo el cambio.", false);
                $('#form-change button').prop('disabled', true);
            }

            function mostrarToast(mensaje, esExito) {
                var $toast = $('#toast-mensaje');
                $toast.removeClass('bg-success bg-danger');
                $toast.addClass(esExito ? 'bg-success' : 'bg-danger');
                $('#toast-texto').text(mensaje);
                
                var bsToast = new bootstrap.Toast($toast[0]);
                bsToast.show();
            }

            $('#form-change').submit(function(e) {
                e.preventDefault();

                var pass1 = $('#newpass').val();
                var pass2 = $('#confirmpass').val();

                if (pass1 !== pass2) {
                    mostrarToast("Las contraseñas no coinciden.", false);
                    return;
                }

                // Construir objeto manualmente
                var datos = {
                    email: $('#email').val().trim(),
                    newpass: pass1,
                    token: tokenURL
                };

                $.post('changePass.php', datos, function(res) {
                    mostrarToast(res.mensaje, true);
                    $('#form-change')[0].reset();
                    // Redirigir al login opcionalmente tras 2 segundos
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 2000);
                }, 'json').fail(function(jqXHR) {
                    var msg = "Error al intentar cambiar la contraseña.";
                    if (jqXHR.responseJSON && jqXHR.responseJSON.mensaje) {
                        msg = jqXHR.responseJSON.mensaje;
                    }
                    mostrarToast(msg, false);
                });
            });
        });
    </script>
</body>
</html>
