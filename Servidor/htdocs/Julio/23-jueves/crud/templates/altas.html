<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask</title>

    <link rel="stylesheet" href="{{url_for('static', filename='CSS/style.css')}}">
    <!-- Bootstrap 5.3 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/altas">Altas</a></li>
                <li><a href="/tablas">Tablas</a></li>
            </ul>
        </nav>
        <hr>
        <h1>Altas</h1>
    </header>
    <main >
        <div class="row justify-content-center w-100">
            <div class="col-md-8 col-lg-6">
                
                <!-- Pestañas/Menú de selección (Por encima del formulario) -->
                <ul class="nav nav-pills nav-justified mb-4" id="pills-tab">
                    <li class="nav-item">
                        <button type="button" 
                                class="nav-link active btn-menu" 
                                data-target="#form-palabras">
                            <i class="bi bi-translate me-1"></i> Palabras
                        </button>
                    </li>
                    <li class="nav-item">
                        <button type="button" 
                                class="nav-link btn-menu" 
                                data-target="#form-orquestas">
                            <i class="bi bi-music-note-list me-1"></i> Orquestas
                        </button>
                    </li>
                </ul>

                <!-- Tarjeta contenedora de los formularios -->
                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <!-- Formulario Palabras -->
                        <form id="form-palabras" action="/insert" method="POST">
                            <input type="hidden" name="tabla" value="palabras">

                            <h4 class="card-title mb-3">Alta de Palabras</h4>

                            <div class="mb-3">
                                <label for="espanol_pal" class="form-label">Español</label>
                                <input type="text" 
                                    class="form-control" 
                                    id="espanol_pal" 
                                    name="espanol_pal" 
                                    placeholder="Ej. Hola" 
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="gallego_pal" class="form-label">Gallego</label>
                                <input type="text" 
                                    class="form-control" 
                                    id="gallego_pal" 
                                    name="gallego_pal" 
                                    placeholder="Ej. Ola" 
                                    required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Insertar</button>
                        </form>

                        <!-- Formulario Orquestas (Oculto por defecto) -->
                        <form id="form-orquestas" action="/insert" method="POST" style="display: none;">
                            <input type="hidden" name="tabla" value="orquestas">

                            <h4 class="card-title mb-3">Alta de Orquestas</h4>

                            <div class="mb-3">
                                <label for="nom_orq" class="form-label">Nombre de la Orquesta</label>
                                <input type="text" 
                                    class="form-control" 
                                    id="nom_orq" 
                                    name="nom_orq" 
                                    placeholder="Ej. Panorama" 
                                    required>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Insertar</button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Librería JQuery (Esencial para tus peticiones AJAX) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- Bootstrap 5.3 (JS Bundle - Necesario para desplegables y componentes web) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    

    <!-- Código JQuery para conmutar los formularios -->
    <script>
        $(document).ready(function() {
            $('.btn-menu').click(function() {
                // 1. Alternar la pestaña activa
                $('.btn-menu').removeClass('active');
                $(this).addClass('active');

                // 2. Ocultar todos los formularios
                $('main form').hide();

                // 3. Mostrar el formulario seleccionado
                var target = $(this).data('target');
                $(target).fadeIn(200); // Un suave efecto de entrada
            });
        });
    </script>
</body>
</html>
