<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquiler de Vehículos</title>
    
    <!-- Bootstrap 5.3 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tu estilo personalizado (Opcional por ahora) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <!-- Logotipo / Home -->
                <a class="navbar-brand fw-bold" href="index.html">
                    <i class="fa-solid fa-car fa-xl text-white me-2"></i> Alquiler
                </a>
                
                <!-- Botón para pantallas móviles -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- PARTE IZQUIERDA: Pestañas de gestión (Vehículos, Reservas, Usuarios...) 
                         Se rellenará con JS solo cuando el usuario inicie sesión -->
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="nav-izquierda"></ul>
                    
                    <!-- PARTE DERECHA: Autenticación (Login / Registro / Logout / Nombre)
                         Se rellenará con JS dependiendo de si está logueado o no -->
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="nav-derecha"></ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL DINÁMICO -->
    <main class="container my-5" id="contenedor-principal">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando aplicación...</span>
            </div>
            <p class="mt-2 text-muted">Comprobando estado de la sesión...</p>
        </div>
    </main>

    L
    <!-- CONTENEDOR DE NOTIFICACIONES (TOAST) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1111">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" id="toast-mensaje">
                    <!-- Aquí se inyectará el texto dinámicamente -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Librería JQuery (Esencial para tus peticiones AJAX) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <!-- Bootstrap 5.3 (JS Bundle - Necesario para desplegables y componentes web) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Tus Scripts Modulares -->
    <script src="JS/globales.js"></script>
    <script src="JS/operaciones.js"></script>
    <script src="JS/main.js"></script>
</body>
</html>
