<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="fixed-top">
    <header>
        <nav class="navbar navbar-expand-lg fixed-top bg-primary">
            <!-- Añadimos h-100 y align-items-center para centrar todo verticalmente en los 80px -->
            <div class="container-fluid h-100 align-items-center">
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <i class="fa-solid fa-basket-shopping"></i>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse h-100 align-items-center" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Favoritos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Comprados</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Vendidos</a>
                        </li>
                    </ul>
                    
                    <!-- Tu buscador con floating label sin añadidos -->
                    <div class="form-floating d-flex align-items-center" role="search">
                        <input type="search" class="form-control bg-white" id="floatingInput" placeholder="Search">
                        <label for="floatingInput" class="text-muted">Search...</label>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section id="top5-productos">
            <div id="carouselExampleCaptions" class="carousel slide d-none">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3" aria-label="Slide 4"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="4" aria-label="Slide 5"></button>
                </div>
                <div class="carousel-inner">
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
        <section id="all-productos" >
            <ul class="row p-5 m-0 d-flex justify-content-center gap-5" id="lista-productos"></ul>
        </section>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script>
        function cargarDatos(config) {
            $.get(
                "buscar.php",
                {
                    tipo: config.tipo,
                    limite: config.limite
                },
                function(echosDelPhp) {
                    config.contenedor.html(echosDelPhp);
                }
            );
        }
        
        // 1. Cargamos el Top 5 en el carrusel
        setTimeout(function() {
            cargarDatos({
                contenedor: $(".carousel-inner"),
                tipo: "carousel",
                limite: 5
            });

            $(".carousel").removeClass("d-none");
        }, 3000);

        // 2. Cargamos todos los productos en la lista inferior
        cargarDatos({
            contenedor: $("#lista-productos"),
            tipo: "lista",
            limite: 0 // 0 significa sin límite en nuestro PHP
        });
    </script>
</body>
</html>
