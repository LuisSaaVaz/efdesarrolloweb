<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triping</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <i class="fa-solid fa-hotel" style="color: rgb(116, 192, 252);"></i>
        <button onclick="visible()"><i class="fa-solid fa-bars" style="color: rgb(116, 192, 252);"></i></button>
    </header>
    <main>
        <h1>Triping</h1>
        <section>
            <ul class="hoteles">

            </ul>
        </section>
        <aside class="invisible">
            <ul class="reservas">
            </ul>
            <h2>Total<span></span></h2>
        </aside>
    </main>

    <dialog id="modal-error">
        <p>¡Lo sentimos! Solo puedes realizar un máximo de 3 reservas.</p>
        <button onclick="document.getElementById('modal-error').close()">Entendido</button>
    </dialog>

    <script src="./script.js"></script>
</body>
</html>
