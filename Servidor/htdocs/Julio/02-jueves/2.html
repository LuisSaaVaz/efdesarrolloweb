<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locura</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            height: 50px;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        main{
            height: calc(100vh - 50px);
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div{
            float: left;
            width: 100%;
        }
        #general{
            width: 600px;
            height: 600px;
            background-color: red;
            
            .izq{
                width: calc(100% - 50px);
                height: 100%;
                background-color: blue;
            }
            .der{
                width: 50px;
                height: 100%;
                background-color: yellow;
            }
            .up{
                width: 100%;
                height: 50px;
                background-color: green;
            }
            .down{
                width: 100%;
                height: calc(100% - 50px);
                background-color: purple;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Locura</h1>
    </header>
    <main>
        <div id="general">
            <div class="izq">
                <div class="up"></div>
                <div class="down">
                    <div class="izq">
                        <div class="up"></div>
                        <div class="down">
                            <div class="izq">
                                <div class="up"></div>
                                <div class="down">
                                    <div class="izq">
                                        <div class="up"></div>
                                        <div class="down">
                                            <div class="izq">
                                                <div class="up"></div>
                                                <div class="down">
                                                    <div class="izq">
                                                        <div class="up"></div>
                                                        <div class="down">
                                                            <div class="izq">
                                                                <div class="up"></div>
                                                                <div class="down">
                                                                    <div class="izq">
                                                                        <div class="up"></div>
                                                                        <div class="down">
                                                                            <div class="izq">
                                                                                <div class="up"></div>
                                                                                <div class="down"></div>
                                                                            </div>
                                                                            <div class="der"></div>
                                                                        </div>
                                                                    </div>
                                                                    <div class="der"></div>
                                                                </div>
                                                            </div>
                                                            <div class="der"></div>
                                                        </div>
                                                    </div>
                                                    <div class="der"></div>
                                                </div>
                                            </div>
                                            <div class="der"></div>
                                        </div>
                                    </div>
                                    <div class="der"></div>
                                </div>
                            </div>
                            <div class="der"></div>
                        </div>
                    </div>
                    <div class="der"></div>
                </div>
            </div>
            <div class="der"></div>
        </div>
    </main>
</body>
</html>
