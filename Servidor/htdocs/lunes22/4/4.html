<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <header>
        <h1>Funciones con Parámetros</h1>
    </header>
    <main>
        <button onclick="cambiar('red')">Rojo</button>
        <button onclick="cambiar('lime')">Verde</button>
        <button onclick="cambiar('yellow')">Amarillo</button>
        <button onclick="cambiar()">Limpiar</button>
    </main>

    <script>
        function cambiar(color = "white") {
            $("body").css("background-color", color)
        }
    </script>
</body>
</html>
