<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table border="1">
        <tr>
            <td data-pos="1"></td>
            <td data-pos="2"></td>
            <td data-pos="3"></td>
        </tr>
        <tr>
            <td data-pos="4"></td>
            <td data-pos="5"></td>
            <td data-pos="6"></td>
        </tr>
        <tr>
            <td data-pos="7"></td>
            <td data-pos="8"></td>
            <td data-pos="9"></td>
        </tr>
    </table>

    <dialog id="modalVictoria">
        <h2 id="mensajeVictoria"></h2>
        <button onclick="cerrarModal()">Jugar de nuevo</button>
    </dialog>

    <script>
        var piece = "X"

        function paint() {
            $("td").on("click", function(){
                if($(this).text() === "") { // Solo pintar si está vacío
                    $(this).text(piece);
                    $(this).addClass(piece);
                    
                    // Comprobamos victoria después de cada clic
                    setTimeout(function() {
                        var resultado = victoria();
                        if (resultado) {
                            // Pintamos las celdas ganadoras de color lime
                            resultado.posiciones.forEach(function(celda) {
                                celda.addClass("ganadora");
                            });
                            
                            $("#mensajeVictoria").text("¡Gana " + resultado.ganador + "!");
                            $("#modalVictoria")[0].showModal();
                        } else {
                            piece = piece === "X" ? "O" : "X";
                        }
                    }, 50);
                }
            })

        }

        function victoria() {
            var comb = [
                [1,2,3], [4,5,6], [7,8,9], // Filas
                [1,4,7], [2,5,8], [3,6,9], // Columnas
                [1,5,9], [3,5,7]           // Diagonales
            ];

            for (var i = 0; i < comb.length; i++) {
                var p = comb[i];
                var c1 = $("[data-pos='" + p[0] + "']");
                var c2 = $("[data-pos='" + p[1] + "']");
                var c3 = $("[data-pos='" + p[2] + "']");

                if (c1.text() !== "" && c1.text() === c2.text() && c2.text() === c3.text()) {
                    return { ganador: c1.text(), posiciones: [c1, c2, c3] };
                }
            }
            return null;
        }

        function cerrarModal() {
            $("#modalVictoria")[0].close();
            $("td").text("").removeClass("X O ganadora");
            piece = "X";
        }

        paint()
    </script>
</body>
</html>
