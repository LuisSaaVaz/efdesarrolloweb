<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ahorcado</h1>
    </header>
    <main>
        <ul class="solucion"></ul>
        <h2>Teclado</h2>
        <ul class="teclado"></ul>
        <img src="./img/0.png" alt="">
    </main>

    <footer>
        <dialog id="modalFinal">
            <h2 id="tituloFinal"></h2>
            <button onclick="jugar()">Volver a jugar</button>
        </dialog>
    </footer>


    <script>
        var abecedario = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "Ñ", "O", "P", "Q", "R", "S", "T", "U", "V", "W", "X", "Y", "Z"];
        var palabras = [
            "AGUA", "ARCO", "AVION", "AZUL", "BARCO", "BESO", "BLANCO", "BOLA", "CASA", "CINE", "COCHE", "CUBO", "DADO", "DEDO", "DIENTE", "DUNA", "ECO", "EDIFICIO", "ELEFANTE", "ENANO", "FARO", "FELIZ", "FIESTA", "FUEGO", "GATO", "GENTE", "GLOBO", "GRIS", "HIELO", "HILO", "HORA", "HUMO", "ISLA", "IMAN", "IGLESIA", "IMAGEN", "JABON", "JARDIN", "JUEGO", "JUNIO", "KILO", "KOALA", "KARATE", "KAYAK", "LUNA", "LAGO", "LIBRO", "LUCES", "MANO", "MESA", "MIEL", "MUNDO", "NUBE", "NARIZ", "NIEVE", "NORTE", "ÑANDU", "ÑAME", "ÑU", "OJO", "OLA", "ORO", "OSO", "PAN", "PAZ", "PIE", "PUEBLO", "QUESO", "QUINCE", "QUIMICA", "QUIETO", "RANA", "RAYO", "RIO", "ROSA", "SOL", "SOPA", "SUR", "SUEÑO", "TREN", "TELA", "TIERRA", "TODO", "UVA", "UNO", "UNIR", "UNIVERSO", "VACA", "VELA", "VIDA", "VIENTO", "WIFI", "WOK", "WAPO", "XILOFONO", "XENON", "YATE", "YESO", "YO", "ZAPATO", "ZONA", "ZUMO"
        ];

        var errors = 0;
        var maxErrors = 6;
        var palSecreta = "";
        var palSecArr = [];
        
        letrasList="";
        abecedario.forEach(letra => {
            letrasList += "<li>"+letra+"</li>"
        });
        $("ul.teclado").html(letrasList);
        
        function jugar () {
            // Limpiamos las clases de las teclas, no volvemos a renderizar todo el HTML
            $("ul.teclado li").removeClass("usada");
            
            
            errors = 0;
            
            // Número al azar entre 0-99
            var num = Math.floor(Math.random() * 100);
            // Palabra secreta segun numero 
            palSecreta = palabras[num];
            console.log(palSecreta);
            // Array de la palabra secreta
            palSecArr = palSecreta.split('');
    
            letrasPal="";
            palSecArr.forEach(letra => {
                letrasPal += "<li></li>"
            });
            $("ul.solucion").html(letrasPal);

            // limpiar la imagen
            $("img").attr("src", "img/"+errors+".png");

            // Cerrar el modal si estaba abierto
            $("#modalFinal")[0].close();
        }

        jugar();

        $("ul.teclado li").on("click", function(){
            // 1. Obtenemos la letra pulsada y deshabilitamos el botón para no repetir
            var letraPulsada = $(this).text();
            $(this).addClass("usada");

            // 2. Comprobamos si la letra existe en la palabra secreta
            var encontrado = false;

            palSecArr.forEach(function(letraSecreta, index) {
                if (letraSecreta === letraPulsada) {
                    // 3. Si coincide, actualizamos el li correspondiente
                    // Usamos .eq(index) para ir al li exacto de esa posición
                    $("ul.solucion li").eq(index).text(letraSecreta);
                    encontrado = true;
                }
            });

            if (!encontrado) {
                console.log("¡Fallaste!");
                errors += 1;

                $("img").attr("src", "img/"+errors+".png");

                if (errors >= maxErrors) {
                    $("#tituloFinal").text("¡Has perdido! La palabra era: " + palSecreta);
                    $("#modalFinal")[0].showModal();
                } 
            }
            
            comprobarVictoria();
        })

        function comprobarVictoria() {
            // Si no hay ningún li que esté vacío, significa que ha completado la palabra
            var letrasFaltantes = $("ul.solucion li").filter(function() {
                return $(this).text() === "";
            }).length;

            if (letrasFaltantes === 0) {
                $("#tituloFinal").text("¡Felicidades! Has adivinado la palabra.");
                $("#modalFinal")[0].showModal();
            }
        }

    </script>
</body>
</html>
