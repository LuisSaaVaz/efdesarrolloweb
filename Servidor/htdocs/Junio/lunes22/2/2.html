<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Insertar datos</h1>
    </header>
    <main>
        <input type="text" placeholder="Titulo">
        <textarea  placeholder="Descripcion"></textarea>
        <input type="number" placeholder="Precio">

        <button onclick="insert()">Grabar</button>

        <p></p>
    </main>

    <script>
        function insert(){
            var input1 =$("input").first().val();
            var input2 =$("textarea").val();
            var input3 =$("input").last().val();
            // Recoger lo escrito en el input
            var texto =  // Variable donde guardo el value del input

            // Llamar al documento php, enviar datos y recibir respuesta
            $.post(
                "./insert.php",
                {titulo_pro: input1, descripcion_pro: input2, precio_pro: input3}, 
                function (response) {
                    $("p").text(response);
                    $("textarea").val("");
                    $("input").last().val("");
                    $("input").first().val("").focus();
                    $("input").first().focus();
                }
            )
        }
    </script>
</body>
</html>
