<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Sala de cine</h1>
    <h2>Reservas: <span></span> <button onclick="impact()">Reservar</button></h2>
    <ul></ul>

    <script>
        function pintar() {
            $.post("pintar.php", function(datosRecibidos) {
                $("ul").html(datosRecibidos);
            });
        }

        pintar();

        var ventas = 0;
        $("span").text(ventas);
        var butacas = [];


        $(document).on("click", "i", function() {
            var color = $(this).css("color") == "rgb(0, 255, 0)" ? "rgb(255, 0, 0)" : "rgb(0, 255, 0)";
            $(this).css("color", $(this).css("color", color))

            var idButaca = $(this).attr("id");

            if ($(this).css("color") == "rgb(255, 0, 0)") {
                ventas -= 1;
                $("span").text(ventas);
                butacas = butacas.filter(function(item) {
                    return item !== idButaca;
                });
            } else {
                ventas += 1;
                $("span").text(ventas);
                butacas.push(idButaca);
            }
        })

        function impact() {
            if (butacas.length === 0) {
                alert("No has seleccionado ninguna butaca.");
                return;
            }

            // Convertimos el array a un string JSON
            var datos = {
                ids: JSON.stringify(butacas)
            };

            $.post("impactar.php", datos, function(response) {
                // response del servidor
                butacas = [];
                $("span").text(0);
                ventas = 0;
                pintar();
                alert("Resultado: " + response);
            });
        }
    </script>
</body>

</html>
