<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

            <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <header>
            <h1>Cambios con scripting</h1>
        </header>
        <main>
            <a href="https://meteogalicia.gal">Tiempo</a>
            
            <br>
            
            <input type="text" name="nombre" id="nombre" placeholder="Nombre" onfocus="hacer()">

            <br>

            <img src="./apagada.jpeg" width="20%" alt="" onmouseover="cambiar()">
        </main>

        <script>
            $("a").prop("href","https://marca.com");
            $("a").attr("href", "https://as.com");
            $("a").text("As");

            $("input").attr("type", "number");
            $("input").prop("readonly", true);
            $("input").prop("disabled", true);
            $("input").attr("onfocus", "deshacer()");
            $("input").attr("onclick", "hacer()");
            $("input").attr("placeholder", "Edad");
            
            // Leer
            // alert($("input").attr("id"));

            function cambiar(){
                var image = $("img").attr("src") === "apagada.jpeg" ? "encendida.jpeg": "apagada.jpeg";
                $("img").attr("src", image)
            }
        </script>
    </body>
</html>
