<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li>
                <a href="https://www.meteogalicia.gal/web/home">Meteogalicia</a>
            </li>
        </ul>
    </nav>
    <br>
    <center>
        <img src="https://wallpapers.com/images/featured/paisajes-2iz0murq98x75o3c.jpg"  alt="paisaje">
    </center>
    <br>
    <form>
        <input type="text" name="nombre" placeholder="Nombre">
        <br>
        <input type="text" name="apellidos" placeholder="Apellidos">
        <br>
        <input type="number" name="numdni" placeholder="Número DNI" max="99999999" min="0">
        <br>
        <input type="text" name="letdni" placeholder="Letra DNI" maxlength="1">
        <br>
        <input type="email" name="email" placeholder="Email">
        <br>
        <input type="password" name="password" placeholder="Password">
        <br>
        <label for="">
            Fecha de nacimiento
            <input type="date" name="cumple" placeholder="Password">
        </label>
        <br>
        <select name="provincia">
            <option value="A Coruña">A Coruña</option>
            <option value="Lugo">Lugo</option>
            <option value="Ourense">Ourense</option>
            <option value="Pontevedra">Pontevedra</option>
        </select>
        <br>
        <input type="number" name="cumple" placeholder="Codigo Postal" max="99999" min="0">
        <br>
        <br>
        <button>Enviar</button>
    </form>
</body>
</html>
